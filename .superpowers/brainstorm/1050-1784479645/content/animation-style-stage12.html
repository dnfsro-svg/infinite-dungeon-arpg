<div class="label">Stage 12 · 动画资产方式</div>
<h2>角色与攻击动作采用哪种制作方式？</h2>
<p class="subtitle">演示重点是“蓄力—挥击—命中—回收”的节奏差异，不代表最终帧数。</p>
<div class="anim-grid cards">
  <div class="anim-card card" data-choice="a-keyframe-sprites" onclick="toggleSelect(this)"><div class="demo a"><div class="ground"></div><div class="fighter"><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div><div class="arm l"></div><div class="arm r"></div><div class="blade"></div></div><div class="impact"></div></div><div class="copy"><h3>A · 关键姿势逐帧 <span class="tag">推荐</span></h3><p>每个动作使用独立透明帧，命中姿势最有力量，适合上挑、浮空和快节奏连击；首批资产数量最多。</p></div></div>
  <div class="anim-card card" data-choice="b-cutout-rig" onclick="toggleSelect(this)"><div class="demo b"><div class="ground"></div><div class="fighter"><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div><div class="arm l"></div><div class="arm r"></div><div class="blade"></div></div><div class="impact"></div></div><div class="copy"><h3>B · 部件骨骼动画</h3><p>头、躯干、手脚分层旋转，复用率高、换装备方便；高速攻击容易出现“纸片木偶感”。</p></div></div>
  <div class="anim-card card" data-choice="c-procedural-static" onclick="toggleSelect(this)"><div class="demo c"><div class="ground"></div><div class="fighter"><div class="head"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div><div class="arm l"></div><div class="arm r"></div><div class="blade"></div></div><div class="impact"></div></div><div class="copy"><h3>C · 单图程序运动</h3><p>角色只用少量静态图，通过位移、缩放、旋转表现动作；成本最低，但与正式材质包目标差距最大。</p></div></div>
</div>
<p style="margin-top:18px" class="subtitle">点击卡片后，在对话中回复 A、B 或 C。</p>
