<h2>主动技能配色优化</h2>
<p class="subtitle">三张图只调整颜色、材质和发光层级；动作、角色、构图和24剑阵保持一致。点击你想采用的方案。</p>

  <div class="palette-info">
    <h3>A · 冷蓝原版强化</h3>
    <p>白色切割核心、青蓝内光、皇家蓝中层、深靛外缘；接触点用少量琥珀火花。最接近原版冷色气质。</p>
    <div class="swatches"><span class="swatch" style="background:#f7fbff"></span><span class="swatch" style="background:#9de6ff"></span><span class="swatch" style="background:#2b70d4"></span><span class="swatch" style="background:#0b2259"></span><span class="swatch" style="background:#ffb35f"></span></div>
  </div>
</div>

<div class="palette-card" data-choice="palette-b-gold-swords" onclick="toggleSelect(this)">
  <img src="/files/palette-b-gold-swords-v3.png" alt="方案B 蓝白斩光与古金剑阵">
  <div class="palette-info">
    <h3>B · 蓝白斩光 + 古金剑阵 <span class="recommended">推荐</span></h3>
    <p>拔刀保持冷蓝；暴风式实体剑改为暗钢与古金刃缘，吸附和高速轨迹仍为蓝白。实体剑、能量与命中三层最清楚。</p>
    <div class="swatches"><span class="swatch" style="background:#f8fbff"></span><span class="swatch" style="background:#82cfff"></span><span class="swatch" style="background:#173c83"></span><span class="swatch" style="background:#d7a94e"></span><span class="swatch" style="background:#5b3b16"></span></div>
  </div>
</div>

<div class="palette-card" data-choice="palette-c-indigo-awakening" onclick="toggleSelect(this)">
  <img src="/files/palette-c-indigo-v3.png" alt="方案C 银蓝与深靛紫觉醒">
  <div class="palette-info">
    <h3>C · 银蓝 + 深靛紫觉醒</h3>
    <p>拔刀保持银蓝；暴风式吸附内圈和远端残影加入深靛紫，中心仍为白蓝。终极感强，但比原版更偏现代。</p>
    <div class="swatches"><span class="swatch" style="background:#f4f8ff"></span><span class="swatch" style="background:#9bdcff"></span><span class="swatch" style="background:#315ac2"></span><span class="swatch" style="background:#31236f"></span><span class="swatch" style="background:#120d34"></span></div>
  </div>
</div>
